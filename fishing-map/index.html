<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎣 Fishing Map</h1>
    <div class="header-actions">
      <button id="add-spot-btn" class="btn">Add Fishing Spot</button>
      <button id="add-catch-btn" class="btn btn-primary">Log a Catch</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>Species Filter</h2>
        <select id="species-filter">
          <option value="all">All species</option>
        </select>
      </div>

      <div class="sidebar-section">
        <h2>Catch Log</h2>
        <ul id="catch-list" class="catch-list">
          <li class="empty-msg">No catches logged yet.</li>
        </ul>
      </div>
    </aside>

    <main>
      <div id="map"></div>
      <p id="hint-banner" class="hint-banner" hidden></p>
    </main>
  </div>

  <!-- Add/Edit Fishing Spot Modal -->
  <dialog id="spot-modal">
    <form id="spot-form" method="dialog">
      <h2>Add Fishing Spot</h2>
      <label>Name
        <input type="text" id="spot-name" required>
      </label>
      <label>Type
        <select id="spot-type">
          <option value="lake">Lake</option>
          <option value="river">River</option>
          <option value="pier">Pier</option>
          <option value="pond">Pond</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Species (comma separated)
        <input type="text" id="spot-species" placeholder="Bass, Crappie">
      </label>
      <label>Notes
        <textarea id="spot-notes" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" id="spot-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Spot</button>
      </div>
    </form>
  </dialog>

  <!-- Log Catch Modal -->
  <dialog id="catch-modal">
    <form id="catch-form" method="dialog">
      <h2>Log a Catch</h2>
      <label>Species
        <input type="text" id="catch-species" required>
      </label>
      <div class="form-row">
        <label>Length (in)
          <input type="number" id="catch-length" min="0" step="0.1">
        </label>
        <label>Weight (lb)
          <input type="number" id="catch-weight" min="0" step="0.1">
        </label>
      </div>
      <label>Date
        <input type="date" id="catch-date" required>
      </label>
      <label>Bait / Lure
        <input type="text" id="catch-bait">
      </label>
      <label>Notes
        <textarea id="catch-notes" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" id="catch-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Catch</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
